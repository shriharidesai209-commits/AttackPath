[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attackpath"
version = "0.1.0"
description = "Graph-powered cybersecurity investigation platform for discovering, explaining, remediating, and verifying multi-hop attack paths."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "AttackPath Team"}
]
keywords = ["cybersecurity", "graph-database", "falkordb", "attack-path", "fastapi", "streamlit"]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "falkordb>=1.0.10",
    "networkx>=3.3",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "streamlit>=1.36.0",
    "pyvis>=0.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["attackpath*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
asyncio_mode = "auto"
